<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سنتر اللعب: مدّ الألف 🎪</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;min-height:100vh;color:#2b2d42;text-align:center;overflow-x:hidden;
background:radial-gradient(circle at 10% 90%,#ef476f55 0 40px,transparent 41px),radial-gradient(circle at 90% 85%,#ffd16688 0 55px,transparent 56px),radial-gradient(circle at 25% 97%,#06d6a066 0 45px,transparent 46px),radial-gradient(circle at 70% 98%,#118ab266 0 50px,transparent 51px),linear-gradient(#e8f7ff,#fff7d6)}
.bg{position:fixed;inset:0;pointer-events:none;font-size:36px;z-index:0}
.bg span{position:absolute;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-20px) rotate(8deg)}}
header{position:sticky;top:0;z-index:5;background:#ef476f;color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:20px;border-bottom:6px solid;border-image:linear-gradient(90deg,#ffd166,#06d6a0,#118ab2,#ffd166) 1}
header button{background:#fff;color:#ef476f;border:0;border-radius:20px;padding:6px 14px;font-size:16px;font-weight:bold;cursor:pointer}
main{position:relative;z-index:1;max-width:920px;margin:auto;padding:14px}
h1{font-size:32px;margin:8px 0;color:#118ab2}
.fat{font-size:66px;animation:fl 3s infinite}
.menu{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.lv{background:#fff;border:5px solid;border-radius:28px;padding:16px;width:250px;cursor:pointer;transition:.2s;box-shadow:0 7px 0 #0002}
.lv:nth-child(1){border-color:#ef476f}.lv:nth-child(2){border-color:#ffb703}.lv:nth-child(3){border-color:#118ab2}
.lv:hover{transform:translateY(-5px) rotate(-1deg)}
.lv .ic{font-size:50px}.lv h3{margin:6px 0;font-size:22px}.lv p{margin:0;font-size:15px}
.lv.done{background:#d8ffe9;border-color:#06d6a0}
.say{background:#fff;border-radius:22px;padding:10px 16px;display:inline-block;font-size:20px;margin:8px 0;border:3px dashed #118ab2}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:12px 0}
.drop{min-width:100px;min-height:100px;border:4px dashed #118ab2;border-radius:24px;background:#ffffffcc;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:40px;font-weight:bold;transition:.2s}
.drop small{font-size:18px;line-height:1.6}
.drop.ok{background:#c9f7de;border:4px solid #06d6a0}
.drop.hot{background:#fff0a8}
.tray{min-height:100px;border:3px solid #ffd166;border-radius:26px;background:#ffffffa0;padding:10px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.card{border-radius:50px;padding:10px 20px;font-size:34px;font-weight:bold;cursor:grab;box-shadow:0 6px 0 #0003,inset 0 -6px 0 #0002;touch-action:none;min-width:80px;color:#fff;text-shadow:0 2px 0 #0003}
.c0{background:#ef476f}.c1{background:#f4a000}.c2{background:#06b886}.c3{background:#118ab2}
.card.w{font-size:30px;border-radius:22px}
.card.lift{opacity:.3}
.ghost{position:fixed;z-index:99;pointer-events:none;transform:rotate(-6deg) scale(1.1);opacity:.95}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pic{font-size:80px;animation:fl 3s infinite}
.slots{display:flex;gap:10px;justify-content:center;align-items:center;margin:10px 0}
.btn{background:#06b886;color:#fff;border:0;border-radius:30px;padding:12px 30px;font-size:22px;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 #048a65;margin:10px}
.bar{height:18px;background:#fff;border-radius:10px;border:2px solid #118ab2;overflow:hidden;margin:6px auto;max-width:400px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ef476f,#ffd166,#06d6a0,#118ab2);transition:.4s}
.modal{position:fixed;inset:0;background:#0006;z-index:50;display:flex;align-items:center;justify-content:center}
.modal div{background:#fff;border-radius:30px;padding:26px;max-width:380px;border:6px solid #ef476f}
.modal h2{font-size:30px;margin:0 0 8px}
.conf{position:fixed;top:-40px;font-size:30px;z-index:60;pointer-events:none;animation:fall 2.5s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
footer{position:relative;z-index:1;padding:14px;font-size:15px;opacity:.85}
</style>
</head>
<body>
<div class="bg"><span style="top:12%;right:5%">🛝</span><span style="top:30%;left:4%">🎈</span><span style="top:60%;right:4%">🧸</span><span style="top:75%;left:7%">🤸</span></div>
<header><span>⭐ <span id="sc">0</span> نقطة</span><span>سنتر اللعب</span><button onclick="menu()">🏠 المراحل</button></header>
<main id="st"></main>
<footer>Created by T. Badria Alfalahi</footer>
<script>
const $=s=>document.querySelector(s),st=$('#st');
let score=0,done={};
const add=n=>{score+=n;$('#sc').textContent=score};
const shuf=a=>[...a].sort(()=>Math.random()-.5);
function drag(el,cb){
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();const r=el.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;
  const g=el.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';document.body.appendChild(g);el.classList.add('lift');
  const mv=ev=>{g.style.left=ev.clientX-dx+'px';g.style.top=ev.clientY-dy+'px';document.querySelectorAll('.hot').forEach(h=>h.classList.remove('hot'));const t=document.elementFromPoint(ev.clientX,ev.clientY);t&&t.closest('.drop')&&t.closest('.drop').classList.add('hot')};
  mv(e);
  const up=ev=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
   g.remove();el.classList.remove('lift');document.querySelectorAll('.hot').forEach(h=>h.classList.remove('hot'));
   const t=document.elementFromPoint(ev.clientX,ev.clientY);cb(el,t&&t.closest('.drop'))};
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
 });
}
const bad=el=>{el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')};
function confetti(){for(let i=0;i<30;i++){const c=document.createElement('div');c.className='conf';c.textContent=['🎈','🧸','⭐','🔴','🎉'][i%5];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3500)}}
function win(n,msg){
 done[n]=1;confetti();
 const all=Object.keys(done).length==3,m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div><div style="font-size:70px">${all?'🏆':'🎈'}</div><h2>${all?'أنتِ بطلة سنتر اللعب!':'أحسنتِ!'}</h2><p style="font-size:20px">${all?'أنهيتِ كل المراحل وأتقنتِ مدّ الألف والهمزة 🎉':msg}</p><button class="btn">${all?'العودة للقائمة':'اختاري مرحلة أخرى'}</button></div>`;
 document.body.appendChild(m);m.querySelector('button').onclick=()=>{m.remove();menu()};
}
function menu(){
 const L=[[1,'🔴','المرحلة ١: كرات المدّ','ضعي كرة المدّ عند حرفها'],[2,'🛝','المرحلة ٢: همزة أم مدّ؟','ميّزي بين الهمزة ومدّ الألف'],[3,'🧩','المرحلة ٣: مكعبات الإسفنج','رتّبي المقاطع لتكوين الكلمة']];
 const p=Object.keys(done).length;
 st.innerHTML=`<div class="fat">🎪🤸</div><h1>سنتر اللعب: مدّ الألف</h1><div class="say">هيا نلعب ونتعلّم! اختاري أي مرحلة تبدئين بها</div><div class="bar"><i style="width:${p/3*100}%"></i></div><div class="menu">${L.map(l=>`<div class="lv ${done[l[0]]?'done':''}" onclick="go(${l[0]})"><div class="ic">${done[l[0]]?'✅':l[1]}</div><h3>${l[2]}</h3><p>${l[3]}</p></div>`).join('')}</div>`;
}
function go(n){[0,L1,L2,L3][n]()}
/* المرحلة 1 */
function L1(){
 const P=[['بَ','بَا'],['تَ','تَا'],['ثَ','ثَا'],['جَ','جَا'],['حَ','حَا'],['خَ','خَا'],['دَ','دَا'],['رَ','رَا']];let n=0;
 st.innerHTML=`<h1>🔴 كرات المدّ</h1><div class="say">اسحبي الكرة التي فيها مدّ الألف إلى حرفها</div><div class="row">${P.map(p=>`<div class="drop" data-k="${p[0]}">${p[0]}<small>🔴 ؟</small></div>`).join('')}</div><div class="tray">${shuf(P).map((p,i)=>`<div class="card c${i%4}" data-k="${p[0]}">${p[1]}</div>`).join('')}</div>`;
 document.querySelectorAll('.card').forEach(c=>drag(c,(el,d)=>{
  if(d&&d.dataset.k&&!d.classList.contains('ok')&&d.dataset.k===el.dataset.k){d.classList.add('ok');d.innerHTML=el.textContent+'<small>✔</small>';el.remove();add(10);if(++n==P.length)setTimeout(()=>win(1,'ملأتِ حوض الكرات بالمدّ!'),400)}
  else bad(el);
 }));
}
/* المرحلة 2 */
function L2(){
 const H=['سَأَلَ','ثَأَر','سَأَم','جَأَر','دَأَب','فَأَز'],M=['سَالَ','ثَار','سَام','جَار','دَاب','فَاز'];let n=0;
 const cards=shuf([...H.map(w=>[w,'h']),...M.map(w=>[w,'a'])]);
 st.innerHTML=`<h1>🛝 همزة أم مدّ؟</h1><div class="say">اسحبي الكلمة إلى الزحليقة الصحيحة</div><div class="row"><div class="drop" data-k="h" style="min-width:160px;min-height:150px;border-color:#ef476f">أَ<small>همزة</small></div><div class="drop" data-k="a" style="min-width:160px;min-height:150px;border-color:#118ab2">ـَا<small>مدّ الألف</small></div></div><div class="tray">${cards.map((c,i)=>`<div class="card w c${i%4}" data-k="${c[1]}">${c[0]}</div>`).join('')}</div>`;
 document.querySelectorAll('.card').forEach(c=>drag(c,(el,d)=>{
  if(d&&d.dataset.k===el.dataset.k){const t=document.createElement('small');t.textContent='✔ '+el.textContent;d.appendChild(t);d.classList.add('ok');el.remove();add(10);if(++n==12)setTimeout(()=>win(2,'ميّزتِ كل الكلمات!'),400)}
  else bad(el);
 }));
}
/* المرحلة 3 */
function L3(){
 const W=shuf([['قَا','ضِ','مُ','قَضَمَ'],['كَا','شِ','فُ','كَشَفَ'],['مَا','نِ','عُ','مَنَعَ'],['نَا','هِ','زُ','نَهَزَ'],['وَا','سِ','مُ','وَسِمَ'],['سَا','حِ','رُ','سَحَرَ'],['عَا','لِ','مُ','عَلِمَ'],['فَا','تِ','حُ','فَتَحَ']]);let i=0;
 function show(){
  const w=W[i],ps=w.slice(0,3);
  st.innerHTML=`<h1>🧩 مكعبات الإسفنج</h1><div class="bar"><i style="width:${i/W.length*100}%"></i></div><div class="pic">🧱</div><div class="say">من الفعل «${w[3]}» ركّبي اسم الفاعل (${i+1}/${W.length})</div><div class="slots">${ps.map(()=>'<div class="drop sl" style="min-width:96px;min-height:96px"></div>').join('')}</div><div class="tray drop" id="tr">${shuf(ps.map((p,k)=>[p,k])).map((x,j)=>`<div class="card c${j%4}" data-i="${x[1]}">${x[0]}</div>`).join('')}</div><div id="msg" class="say" style="visibility:hidden"></div>`;
  const slots=[...document.querySelectorAll('.sl')];
  document.querySelectorAll('.card').forEach(c=>drag(c,(el,d)=>{
   if(!d)return;
   if(d.id==='tr')d.appendChild(el);else if(d.classList.contains('sl')&&!d.firstChild)d.appendChild(el);else return;
   if(slots.every(s=>s.firstChild)){
    const ok=slots.every((s,k)=>+s.firstChild.dataset.i===k),m=$('#msg');m.style.visibility='visible';
    if(ok){slots.forEach(s=>s.classList.add('ok'));m.textContent='✅ '+ps.join('')+' — أحسنتِ!';add(15);
     const b=document.createElement('button');b.className='btn';b.textContent=i==W.length-1?'إنهاء 🎈':'التالي ⬅';b.onclick=()=>{if(++i<W.length)show();else win(3,'ركّبتِ كل الكلمات!')};st.appendChild(b)}
    else{m.textContent='❌ حاولي مرة أخرى!';slots.forEach(s=>{bad(s);$('#tr').appendChild(s.firstChild)})}
   }
  }));
 }
 show();
}
menu();
</script>
</body>
</html>
